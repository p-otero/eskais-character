name: Publish

# Publishes to npm when a version tag (v0.1.0, …) is pushed. npm trusted publishing: GitHub's OIDC token proves this
# workflow is the publisher, so no npm token lives in the repository, and npm adds provenance automatically. One-time
# setup on npmjs.com: package settings → Trusted publisher → GitHub Actions, repository p-otero/eskais-character,
# workflow publish.yml, environment npm.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      # The OIDC token npm exchanges for a short-lived publish credential (trusted publishing and provenance).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: The tag matches package.json's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Node 24's npm is 11.5.1 or later, which trusted publishing needs
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run guards
      - name: Package checks (publint, Are the Types Wrong)
        run: bun run check:package
      - run: bunx playwright install --with-deps chromium
      # No cache in a publish workflow: a poisoned cache would reach the published package's checks.
      - run: node tooling/fetch-models.mjs
      - run: bun run test:browser
      - name: The packed package works in fresh Vite, Next.js and bun apps
        run: bun run test:consumers
      - name: Publish (trusted publishing, with provenance)
        run: npm publish --access public --provenance
